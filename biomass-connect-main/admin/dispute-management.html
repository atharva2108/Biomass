<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispute Management | Admin | Biomass Connect</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/admin/dispute-management.css">
</head>

<body data-role="admin" data-page="dispute-management">

    <div class="app-shell">

        <aside class="sidebar" id="sidebar"></aside>

        <div class="app-main">

            <header class="topbar" id="topbar"></header>

            <main class="page">

                <div class="page-header">
                    <div>
                        <h1>Dispute Management</h1>
                        <p class="page-subtitle">View and resolve complaints raised by farmers, manufacturers and power plants.</p>
                    </div>
                </div>

                <section class="card">
                    <div class="card-body">

                        <div class="tabs" id="statusTabs" role="tablist">
                            <button class="tab active" type="button" data-status="Open">Open (<span class="count">0</span>)</button>
                            <button class="tab" type="button" data-status="Resolved">Resolved (<span class="count">0</span>)</button>
                            <button class="tab" type="button" data-status="All">All (<span class="count">0</span>)</button>
                        </div>

                        <div class="toolbar">
                            <div class="search">
                                <i class="fa-solid fa-magnifying-glass"></i>
                                <input type="search" id="searchInput" placeholder="Search complaint ID, order ID or participant" aria-label="Search complaints" data-novalidate>
                            </div>
                            <select id="categoryFilter" aria-label="Filter by category" data-novalidate>
                                <option value="All">All Categories</option>
                            </select>
                        </div>

                        <div class="table-wrap">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Complaint</th>
                                        <th>Raised By</th>
                                        <th>Against</th>
                                        <th>Order</th>
                                        <th>Category</th>
                                        <th>Raised On</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="disputeTable"></tbody>
                            </table>
                        </div>

                    </div>
                </section>

            </main>

        </div>

    </div>

    <!-- VIEW COMPLAINT MODAL -->

    <div class="modal-backdrop" id="viewModal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
            <div class="modal-header">
                <h3 id="viewTitle">Complaint</h3>
                <button class="modal-close" type="button" data-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="viewBody"></div>
            <div class="modal-footer" id="viewFooter"></div>
        </div>
    </div>

    <!-- RESOLVE MODAL -->

    <div class="modal-backdrop" id="resolveModal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resolveTitle">
            <div class="modal-header">
                <h3 id="resolveTitle">Resolve Complaint</h3>
                <button class="modal-close" type="button" data-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="resolveForm" novalidate>
                <div class="modal-body">
                    <p class="text-muted mb-2" id="resolveIntro"></p>
                    <div class="form-group">
                        <label for="resolutionText">Resolution</label>
                        <textarea id="resolutionText" rows="5" placeholder="Describe how the complaint was resolved (min. 10 characters)" data-label="Resolution" data-rules="required|text|minlen:10|maxlen:500"></textarea>
                        <small class="form-hint">The user who raised the complaint will see this on their billing page.</small>
                        <small class="error"></small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-close>Cancel</button>
                    <button class="btn btn-primary" type="submit"><i class="fa-solid fa-check"></i> Mark as Resolved</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/common/toast.js"></script>
    <script src="../js/common/validation.js"></script>
    <script src="../js/common/store.js"></script>
    <script src="../js/common/layout.js"></script>
    <script src="../js/admin/admin-common.js"></script>
    <script src="../js/admin/dispute-management.js"></script>

</body>

</html>
