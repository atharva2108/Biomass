<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase History | Power Plant | Biomass Connect</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/powerplant/history.css">
</head>

<body data-role="powerplant" data-page="history">

    <div class="app-shell">

        <aside class="sidebar" id="sidebar"></aside>

        <div class="app-main">

            <header class="topbar" id="topbar"></header>

            <main class="page">

                <div class="page-header">
                    <div>
                        <h1>Purchase History</h1>
                        <p class="page-subtitle">Delivered pellet orders and what you spent on them.</p>
                    </div>
                    <div class="page-actions">
                        <a class="btn btn-secondary" href="tracking.html">
                            <i class="fa-solid fa-truck-fast"></i> Order Tracking
                        </a>
                    </div>
                </div>

                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-truck-ramp-box"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiOrders">0</div>
                            <div class="kpi-label">Delivered Orders</div>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-weight-hanging"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiTons">0 t</div>
                            <div class="kpi-label">Pellets Delivered</div>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiSpend">₹0</div>
                            <div class="kpi-label">Total Spend</div>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-scale-balanced"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiAvg">₹0</div>
                            <div class="kpi-label">Average Price / Ton</div>
                        </div>
                    </div>
                </div>

                <section class="card">

                    <div class="card-header">
                        <div>
                            <div class="card-title">Delivered Orders</div>
                            <div class="card-subtitle" id="resultCount"></div>
                        </div>
                    </div>

                    <form class="card-body" id="filterForm" novalidate>
                        <div class="filter-grid">
                            <div class="form-group">
                                <label for="fromDate">Delivered From</label>
                                <input type="date" id="fromDate" data-label="From date" data-rules="date|notFuture">
                                <small class="error" id="fromDateError"></small>
                            </div>
                            <div class="form-group">
                                <label for="toDate">Delivered To</label>
                                <input type="date" id="toDate" data-label="To date" data-rules="date|notFuture|sameOrAfter:#fromDate">
                                <small class="error" id="toDateError"></small>
                            </div>
                            <div class="form-group">
                                <label for="supplierFilter">Supplier</label>
                                <select id="supplierFilter" data-novalidate>
                                    <option value="">All suppliers</option>
                                </select>
                            </div>
                            <div class="form-group filter-actions">
                                <button class="btn btn-secondary" type="reset"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                            </div>
                        </div>
                    </form>

                    <div class="table-wrap">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Supplier</th>
                                    <th>Pellet Type</th>
                                    <th>Quantity</th>
                                    <th>Price / Ton</th>
                                    <th>Total</th>
                                    <th>Ordered On</th>
                                    <th>Delivered On</th>
                                    <th>Batch Score</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="historyTable"></tbody>
                        </table>
                    </div>

                </section>

            </main>

        </div>

    </div>

    <!-- VIEW ORDER MODAL -->

    <div class="modal-backdrop" id="viewModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="viewModalTitle">
            <div class="modal-header">
                <h3 id="viewModalTitle">Order Details</h3>
                <button class="modal-close" type="button" data-close-modal aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="viewModalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" data-close-modal>Close</button>
            </div>
        </div>
    </div>

    <script src="../js/common/toast.js"></script>
    <script src="../js/common/validation.js"></script>
    <script src="../js/common/store.js"></script>
    <script src="../js/common/layout.js"></script>
    <script src="../js/powerplant/plant.js"></script>
    <script src="../js/powerplant/history.js"></script>

</body>

</html>
