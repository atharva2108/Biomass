<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History | Farmer | Biomass Connect</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/farmer/history.css">
</head>

<body data-role="farmer" data-page="history">

    <div class="app-shell">

        <aside class="sidebar" id="sidebar"></aside>

        <div class="app-main">

            <header class="topbar" id="topbar"></header>

            <main class="page">

                <div class="page-header">
                    <div>
                        <h1>Order History</h1>
                        <p class="page-subtitle">Delivered orders with your sales summary.</p>
                    </div>
                </div>

                <!-- KPI CARDS -->

                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-clipboard-list"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiOrders">0</div>
                            <div class="kpi-label">Delivered Orders</div>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-weight-hanging"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiTons">0</div>
                            <div class="kpi-label">Tons Sold</div>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiRevenue">₹0</div>
                            <div class="kpi-label">Revenue</div>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-scale-balanced"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiAvg">₹0</div>
                            <div class="kpi-label">Avg. Price / Ton</div>
                        </div>
                    </div>
                </div>

                <section class="card">

                    <div class="card-header">
                        <div>
                            <div class="card-title">Delivered Orders</div>
                            <div class="card-subtitle" id="resultCount">0 orders</div>
                        </div>
                    </div>

                    <div class="card-body">

                        <form class="filter-bar" id="filterForm" novalidate>
                            <div class="form-group filter-search">
                                <label for="searchInput">Search</label>
                                <input type="search" id="searchInput" placeholder="Order ID, manufacturer or biomass" data-novalidate>
                            </div>
                            <div class="form-group">
                                <label for="fromDate">Order Date From</label>
                                <input type="date" id="fromDate" data-label="From date" data-rules="date|notFuture|maxDate:#toDate">
                            </div>
                            <div class="form-group">
                                <label for="toDate">Order Date To</label>
                                <input type="date" id="toDate" data-label="To date" data-rules="date|notFuture|sameOrAfter:#fromDate">
                            </div>
                            <div class="filter-actions">
                                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-filter"></i> Apply</button>
                                <button type="button" class="btn btn-secondary" id="clearBtn">Clear</button>
                            </div>
                        </form>

                        <div class="table-wrap">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Manufacturer</th>
                                        <th>Biomass</th>
                                        <th>Quantity</th>
                                        <th>Price / Ton</th>
                                        <th>Amount</th>
                                        <th>Order Date</th>
                                        <th>Delivered On</th>
                                        <th>Payment</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTable"></tbody>
                            </table>
                        </div>

                    </div>

                </section>

            </main>

        </div>

    </div>

    <script src="../js/common/toast.js"></script>
    <script src="../js/common/validation.js"></script>
    <script src="../js/common/store.js"></script>
    <script src="../js/common/layout.js"></script>
    <script src="../js/farmer/farmer-utils.js"></script>
    <script src="../js/farmer/history.js"></script>

</body>

</html>
